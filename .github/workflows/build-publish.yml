name: OpenG2P Build & Publish

# Reusable workflow: builds every Docker image a service repo owns and packages
# its Helm chart, all at ONE version derived from the git ref by
# ci/version/derive-version.sh.
#
# Callers stay ~10 lines and never change when the versioning policy changes;
# pin them to @v1 and move the tag to roll a new policy out to every repo.
#
# Guarantees:
#   * every image and the chart share one version per commit
#   * an immutable version is never overwritten (the run fails instead)
#   * a release (tag N.N.N) is a RETAG of the digest the release line already
#     built and tested -- it is never rebuilt
#
# See ci/README.md for the policy table.

on:
  workflow_call:
    inputs:
      images:
        description: >-
          JSON array of {name, dockerfile, context?, repo?, pins?}.
          `name` labels the build; `repo` overrides the image repository, which
          otherwise defaults to <namespace>/<name>; `pins` is a list of
          {arg, repo, ref} whose git ref is resolved to a SHA, passed as a
          build-arg, and recorded as an org.openg2p.pin.* label.
          Pins are per-image because they describe what is compiled into THAT
          image -- a repo-wide pin would stamp a false provenance label onto
          images that never consume the arg.
          Empty (the default) = this repo builds no image (a library, or a
          chart-only repo). A service that builds images passes them here.
        required: false
        type: string
        default: '[]'
      chart-path:
        description: >-
          Path to the chart dir. Empty = this repo publishes no chart.
          Accepts EITHER a single path ("helm/my-chart") or a JSON array of
          paths ('["helm/a","helm/b"]') for a repo that publishes more than one
          chart; each is packaged and published independently, under the same
          version. The single-path form is unchanged.
        required: false
        type: string
        default: ''
      chart-image-paths:
        description: 'JSON array of yq paths in values.yaml to set to the version, e.g. [".image.tag"]'
        required: false
        type: string
        default: '[]'
      chart-inherit-questions:
        description: >-
          Optional, for WRAPPER charts only (a chart that owns no templates and
          just pins another chart plus a values overlay). JSON:
          {"dependency":"<subchart name>","alias":"<values key>"}.
          Rancher reads questions.yaml only from the ROOT of the chart being
          installed, so a wrapper otherwise shows an empty form. When set, the
          chart's questions.yaml is REGENERATED at package time from that
          dependency, with every non-`global.` variable prefixed by the alias --
          so the wrapper offers the same form as its dependency and cannot drift
          from the pinned version. Leave empty for normal charts (no-op).
        required: false
        type: string
        default: ''
      chart-oci-repo:
        description: >-
          If set (e.g. oci://ghcr.io/openg2p), the chart is PUSHED to this OCI
          registry instead of the HTTP helm-repo/gh-pages. Consumers install via
          `helm install oci://.../<chart> --version X`. Empty = classic HTTP repo.
        required: false
        type: string
        default: ''
      chart-gitlab-project:
        description: >-
          If set (e.g. openg2p/consent-manager), the chart is pushed to that
          GitLab project's Helm Package Registry (index-based, so Rancher browses
          all chart versions from ONE `helm repo add` URL). The path is
          URL-encoded, so no numeric project id is needed. Takes precedence over
          chart-oci-repo and the gh-pages path.
        required: false
        type: string
        default: ''
      chart-gitlab-host:
        description: 'GitLab base URL for the Helm registry (self-host later). Used only with chart-gitlab-project.'
        required: false
        type: string
        default: 'https://gitlab.com'
      chart-gitlab-channel:
        description: 'GitLab Helm channel to publish under (the segment in the repo-add URL).'
        required: false
        type: string
        default: stable
      artifact-source:
        description: >-
          Where this repo's artifacts live, shown in the changelog catalogue
          (e.g. ghcr.io/openg2p). Cosmetic; empty = not shown.
        required: false
        type: string
        default: ''
      registry:
        required: false
        type: string
        default: docker.io
      namespace:
        required: false
        type: string
        default: openg2p
      platforms:
        required: false
        type: string
        default: linux/amd64
      helm-repo:
        required: false
        type: string
        default: openg2p/openg2p-helm
      helm-repo-branch:
        required: false
        type: string
        default: gh-pages
      helm-repo-url:
        required: false
        type: string
        default: https://openg2p.github.io/openg2p-helm
      packaging-ref:
        description: 'Ref of openg2p-packaging to load ci/ scripts from. Keep in sync with the @ref you call this workflow at.'
        required: false
        type: string
        default: main
      allow-overwrite:
        description: 'Republish a version that already exists. Escape hatch; leave false.'
        required: false
        type: boolean
        default: false
      changelog-repo:
        required: false
        # The catalogue has its own repo (published at openg2p.github.io/versions).
        # It used to be this project's gh-pages branch, which put a high-churn
        # generated site in the same repo as the CI that generates it.
        type: string
        default: openg2p/versions
      changelog-branch:
        required: false
        type: string
        default: develop
      changelog_skip_ai:
        description: 'Publish the changelog with human notes only, no AI summary.'
        required: false
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for an already-published version (e.g. 1.0.1). Skips build/publish.'
        required: false
        type: string
        default: ''
      changelog_kind:
        description: "library => a code library consumed by git ref: no image/chart is built; the changelog tracks each moving branch (by commit SHA) plus tags."
        required: false
        type: string
        default: service
    secrets:
      # Optional so a library caller (changelog_kind: library, no images) can omit them.
      # A service that actually builds images must still pass both, or the login fails.
      docker_hub_actor:
        required: false
      docker_hub_token:
        required: false
      # GitLab deploy-token (username + token) used when publishing images to the
      # GitLab Container Registry and/or the chart to a GitLab Helm registry.
      gitlab_registry_user:
        required: false
      gitlab_registry_token:
        required: false
      OPENG2P_BOT_GITHUB_PAT:
        required: false
      OPENROUTER_API_KEY:
        required: false
    outputs:
      version:
        value: ${{ jobs.version.outputs.version }}

jobs:
  version:
    # Dependabot opens a branch per security advisory, and `branches: ["**"]` in the
    # callers means each one starts a full build. Those runs can never succeed:
    # GitHub deliberately withholds Actions secrets from Dependabot-triggered events,
    # so they die at `docker login` -- burning minutes and filling the run list with
    # red that hides real failures.
    #
    # Gating the FIRST job skips everything downstream, so the run shows as skipped
    # rather than failed, and it applies to every caller without editing their stubs.
    # Building other branches stays deliberate: a feature branch builds images at
    # 0.0.0-<branch>.N and skips chart/changelog, which is the smoke-test path.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      frozen: ${{ steps.v.outputs.frozen }}
      alias: ${{ steps.v.outputs.alias }}
      publish_chart: ${{ steps.v.outputs.publish_chart }}
      chart_paths: ${{ steps.charts.outputs.paths }}
      promote_from: ${{ steps.v.outputs.promote_from }}
      revision: ${{ steps.v.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # rev-list --count and the tag lookups need full history
          fetch-tags: true

      - name: Load versioning policy
        uses: actions/checkout@v4
        with:
          repository: openg2p/openg2p-packaging
          ref: ${{ inputs.packaging-ref }}
          path: .openg2p-ci
          sparse-checkout: ci

      - name: Derive version
        id: v
        run: |
          if [ "${{ inputs.changelog_kind }}" = "library" ]; then
            # A library builds no artifact -> no derived SemVer. Identity = the tag (a
            # release) or the moving branch (tracked by commit SHA). images/chart skipped.
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "revision=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "publish_chart=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "frozen=true"  >> "$GITHUB_OUTPUT"
            else
              echo "frozen=false" >> "$GITHUB_OUTPUT"
            fi
          else
            bash .openg2p-ci/ci/version/derive-version.sh
          fi

      # A withdrawn version must never come back. `0.0.0-develop.N` is derived from the
      # commit COUNT, so after a force-push a different commit can land on a withdrawn
      # N -- and with the artifact already deleted, the immutability guard (which only
      # trips when the version still EXISTS from another commit) would not notice.
      # Anyone still pinning that version would then silently get different bytes.
      # Fail-open on a fetch error: this must never block a build for a network blip.
      - name: Refuse a withdrawn version
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.event.repository.name }}
          CL_REPO: ${{ inputs.changelog-repo }}
          CL_BRANCH: ${{ inputs.changelog-branch }}
        run: |
          url="https://raw.githubusercontent.com/${CL_REPO}/${CL_BRANCH}/${REPO}/.withdrawn"
          body=$(curl -fsSL --max-time 20 "$url" 2>/dev/null || true)
          [ -n "$body" ] || exit 0
          if printf '%s\n' "$body" | grep -q "^${VERSION}|"; then
            line=$(printf '%s\n' "$body" | grep -m1 "^${VERSION}|")
            echo "::error::${VERSION} was WITHDRAWN and must not be republished — ${line#*|}"
            echo "Its artifacts were deleted on purpose. If this is a force-push that reused the"
            echo "commit count, push an empty commit so the build gets a fresh version."
            exit 1
          fi

      # Normalise chart-path into a JSON array so the chart job can matrix over
      # it. Accepts the historical single-path string and a JSON array alike, so
      # every existing caller keeps working unchanged.
      - name: Resolve chart paths
        id: charts
        env:
          CHART_PATH: ${{ inputs.chart-path }}
        run: |
          set -euo pipefail
          if [ -z "${CHART_PATH}" ]; then
            paths='[]'
          elif [ "${CHART_PATH#[}" != "${CHART_PATH}" ]; then
            # Already a JSON array. Validate rather than trust: a malformed value
            # would otherwise surface as an unreadable matrix error much later.
            if ! paths=$(printf '%s' "${CHART_PATH}" | jq -ce 'if type=="array" then . else error("not an array") end'); then
              echo "::error::chart-path looks like JSON but is not an array of paths: ${CHART_PATH}"
              exit 1
            fi
          else
            paths=$(jq -cn --arg p "${CHART_PATH}" '[$p]')
          fi
          echo "paths=${paths}" >> "$GITHUB_OUTPUT"
          echo "chart paths: ${paths}"

      - name: Summary
        run: |
          echo "### \`${{ steps.v.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--|--|" >> "$GITHUB_STEP_SUMMARY"
          echo "| channel | ${{ steps.v.outputs.channel }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| frozen | ${{ steps.v.outputs.frozen }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| revision | \`${{ steps.v.outputs.revision }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| chart | ${{ steps.v.outputs.publish_chart }} |" >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: version
    # A library builds no image. A CHART-ONLY repo declares none either -- its chart
    # deploys upstream third-party images consumed as-is -- and an empty matrix makes
    # the job fail to materialise rather than skip, which reads as a failed run with
    # no jobs listed and no error.
    if: inputs.changelog_kind != 'library' && toJSON(fromJSON(inputs.images)) != '[]'
    runs-on: ubuntu-latest
    # packages: write lets us push to GHCR with the built-in GITHUB_TOKEN. The
    # CALLER stub must also grant it (permissions are capped by the caller).
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    name: ${{ matrix.image.name }}
    env:
      IMAGE: ${{ inputs.registry }}/${{ matrix.image.repo || format('{0}/{1}', inputs.namespace, matrix.image.name) }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Registry auth, by host:
      #   ghcr.io           -> built-in GITHUB_TOKEN
      #   registry.gitlab.* -> gitlab_registry_user / gitlab_registry_token (deploy token)
      #   anything else     -> docker_hub_actor / docker_hub_token
      - uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry == 'docker.io' && '' || inputs.registry }}
          username: ${{ inputs.registry == 'ghcr.io' && github.actor || startsWith(inputs.registry, 'registry.gitlab') && secrets.gitlab_registry_user || secrets.docker_hub_actor }}
          password: ${{ inputs.registry == 'ghcr.io' && secrets.GITHUB_TOKEN || startsWith(inputs.registry, 'registry.gitlab') && secrets.gitlab_registry_token || secrets.docker_hub_token }}

      # Idempotent guard: SKIP if this exact version was already built from THIS
      # commit (so a re-run safely finishes a partially-published pipeline); FAIL
      # only if it exists from a DIFFERENT commit (real drift). Never overwrites.
      - name: Immutability / idempotency guard
        id: guard
        env:
          REVISION: ${{ needs.version.outputs.revision }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            existing_rev=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
              --format '{{json .Image}}' 2>/dev/null \
              | jq -r '.config.Labels["org.opencontainers.image.revision"] // ""' 2>/dev/null || true)
            if [ "$existing_rev" = "$REVISION" ]; then
              echo "$IMAGE:$VERSION already built from this commit ($REVISION); skipping (idempotent)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            elif [ "${{ inputs.allow-overwrite }}" != "true" ]; then
              echo "::error::$IMAGE:$VERSION exists from a DIFFERENT commit (${existing_rev:-unknown} != $REVISION). Immutable versions are never republished."
              exit 1
            else
              echo "::warning::overwriting $IMAGE:$VERSION (allow-overwrite)"
            fi
          fi

      # ---------------- release: promote, never rebuild ----------------
      - name: Promote tested digest to ${{ needs.version.outputs.version }}
        if: needs.version.outputs.frozen == 'true' && steps.guard.outputs.skip != 'true'
        run: |
          src=""
          for cand in ${{ needs.version.outputs.promote_from }}; do
            if docker buildx imagetools inspect "$IMAGE:$cand" >/dev/null 2>&1; then
              src="$cand"; break
            fi
          done
          if [ -z "$src" ]; then
            line="${VERSION%.*}"
            echo "::error::nothing to promote for $IMAGE (release ${VERSION}, commit ${{ needs.version.outputs.revision }})."
            echo "::error::looked for already-built images: ${{ needs.version.outputs.promote_from }}"
            echo "A release PROMOTES the digest CI already built and tested for this commit; it never rebuilds."
            echo "This commit was never built -- most likely the tag was pushed WITHOUT first pushing its branch"
            echo "(pushing only a tag skips the build)."
            echo "Fix: delete the tag, push branch '${line}' (or the develop branch), let its pipeline go GREEN,"
            echo "then re-tag THAT commit and push the tag:"
            echo "  git push origin :refs/tags/${VERSION}"
            echo "  git push origin ${line}"
            echo "  git tag -a ${VERSION} <built-commit> -m '...' && git push origin ${VERSION}"
            exit 1
          fi
          echo "Promoting $IMAGE:$src -> $IMAGE:$VERSION (same digest, no rebuild)"
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$src"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ .Manifest.Digest }}'

      # ---------------- everything else: build ----------------
      - name: Resolve pinned git refs
        id: pins
        if: needs.version.outputs.frozen != 'true' && steps.guard.outputs.skip != 'true'
        env:
          PINS: ${{ toJSON(matrix.image.pins) }}   # `null` when the image declares none
          DOCKERFILE: ${{ matrix.image.dockerfile }}
        run: |
          args=""; labels=""
          while IFS= read -r pin; do
            [ -n "$pin" ] || continue
            arg=$(jq -r .arg <<<"$pin")
            repo=$(jq -r .repo <<<"$pin")
            ref=$(jq -r .ref <<<"$pin")

            # A build-arg the Dockerfile never declares is silently discarded by
            # buildx -- but we would still stamp an org.openg2p.pin.* label
            # claiming that dependency is inside the image. Refuse.
            if ! grep -qE "^[[:space:]]*ARG[[:space:]]+${arg}([[:space:]]|=|$)" "$DOCKERFILE"; then
              echo "::error::$DOCKERFILE declares no 'ARG $arg'; pinning it would be a false provenance claim"
              exit 1
            fi

            sha=$(git ls-remote "$repo" "$ref" | head -1 | cut -f1)
            [ -n "$sha" ] || sha="$ref"    # already a SHA
            echo "$arg: $ref -> $sha"
            args+="${arg}=${sha}"$'\n'
            key=$(printf '%s' "$arg" | tr '[:upper:]_' '[:lower:]-')
            labels+="org.openg2p.pin.${key}=${sha}"$'\n'
          done < <(jq -c '.[]?' <<<"$PINS")
          { echo "args<<EOF"; printf '%s' "$args"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          { echo "labels<<EOF"; printf '%s' "$labels"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        if: needs.version.outputs.frozen != 'true' && steps.guard.outputs.skip != 'true'
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$VERSION"
            [ -n "${{ needs.version.outputs.alias }}" ] && echo "$IMAGE:${{ needs.version.outputs.alias }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: needs.version.outputs.frozen != 'true' && steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          platforms: ${{ inputs.platforms }}
          build-args: ${{ steps.pins.outputs.args }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.version.outputs.revision }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            ${{ steps.pins.outputs.labels }}

  chart:
    needs: [version, images]
    # always() so a SKIPPED images job does not skip the chart with it: a chart-only
    # repo declares no images, and a library skips them too. A FAILED images job must
    # still block the chart -- publishing a chart whose images did not build is the
    # drift this pipeline exists to prevent -- hence the explicit result check rather
    # than a bare always().
    if: >-
      always() &&
      needs.version.result == 'success' &&
      needs.images.result != 'failure' && needs.images.result != 'cancelled' &&
      needs.version.outputs.chart_paths != '[]' && needs.version.outputs.publish_chart == 'true'
    runs-on: ubuntu-latest
    # One job per chart. A repo that publishes a single chart gets a
    # single-element matrix and behaves exactly as before.
    strategy:
      # Independent publishes: one chart failing must not cancel a sibling that
      # would otherwise have succeeded.
      fail-fast: false
      matrix:
        chart-path: ${{ fromJson(needs.version.outputs.chart_paths) }}
    # packages: write for the OCI push path (harmless for the HTTP path).
    permissions:
      contents: read
      packages: write
    # Serialises this repo's own publishes. It CANNOT serialise across repos --
    # concurrency groups are scoped to a repository -- and gh-pages is shared by
    # all of them, so the push below retries on rejection.
    #
    # The group is deliberately NOT keyed on the chart: when a repo publishes
    # several charts, their matrix legs must queue behind one another rather than
    # race to push the same gh-pages branch.
    concurrency:
      group: helm-publish-${{ github.repository }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Pin image tags into values.yaml
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          values="${{ matrix.chart-path }}/values.yaml"
          for path in $(jq -r '.[]' <<<'${{ inputs.chart-image-paths }}'); do
            # The path MUST already exist. yq creates missing keys rather than
            # failing, so a wrong path silently writes a stray key and leaves the
            # real tag at the moving `develop` alias -- i.e. an unpinned chart that
            # still "verifies". Checking existence BEFORE the write is what catches
            # that; checking only after cannot (it reads back the key it created).
            [ "$(yq "$path" "$values")" != "null" ] || {
              echo "::error::$path does not exist in $values. Give the path as it is"
              echo "::error::in values.yaml (e.g. .myApi.image.tag) -- not the template's"
              echo "::error::scoped view (.image.tag). A wrong path ships the chart UNPINNED."
              exit 1; }
            yq -i "$path = strenv(V)" "$values"
            got=$(yq "$path" "$values")
            [ "$got" = "$V" ] || { echo "::error::$path is '$got', expected '$V'"; exit 1; }
            echo "  ok  $path = $V"
          done
          # The repo keeps a placeholder; the real tag exists only in the tarball.
          git --no-pager diff --stat -- "$values" || true

      - name: Stamp source commit into the chart
        env:
          REVISION: ${{ needs.version.outputs.revision }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          chart="${{ matrix.chart-path }}/Chart.yaml"
          # Record the commit in the chart itself, so its provenance does not
          # depend on the rev-list ordinal (which merge commits can make
          # ambiguous). Mirrors the OCI labels on the images.
          REVISION="$REVISION" SOURCE="$SOURCE" yq -i '
            .annotations["org.opencontainers.image.revision"] = strenv(REVISION) |
            .annotations["org.opencontainers.image.source"]   = strenv(SOURCE)
          ' "$chart"
          got=$(yq '.annotations["org.opencontainers.image.revision"]' "$chart")
          [ "$got" = "$REVISION" ] || { echo "::error::revision annotation is '$got'"; exit 1; }
          echo "  ok  revision = $REVISION"

      # Resolves dependencies into <chart>/charts/. Split out of Package so the
      # questions step below can read a dependency's questions.yaml.
      - name: Resolve chart dependencies
        run: helm dep up "${{ matrix.chart-path }}"

      - name: Load packaging scripts
        if: inputs.chart-inherit-questions != ''
        uses: actions/checkout@v4
        with:
          repository: openg2p/openg2p-packaging
          ref: ${{ inputs.packaging-ref }}
          path: .openg2p-ci
          sparse-checkout: ci

      # Wrapper charts only: rebuild questions.yaml from the pinned dependency so
      # Rancher shows its full form. No-op for every other repo.
      - name: Inherit questions.yaml from dependency
        if: inputs.chart-inherit-questions != ''
        env:
          SPEC: ${{ inputs.chart-inherit-questions }}
        run: |
          dep=$(jq -er '.dependency' <<<"$SPEC") || {
            echo "::error::chart-inherit-questions must be JSON with a .dependency key"; exit 1; }
          alias=$(jq -er '.alias' <<<"$SPEC") || {
            echo "::error::chart-inherit-questions must be JSON with an .alias key"; exit 1; }
          bash .openg2p-ci/ci/chart/inherit-questions.sh "${{ matrix.chart-path }}" "$dep" "$alias"

      - name: Package
        id: pkg
        run: |
          helm package "${{ matrix.chart-path }}" --version "$VERSION" --app-version "$VERSION" -d dist/
          ls -l dist/
          chart="${{ matrix.chart-path }}/Chart.yaml"
          echo "name=$(yq '.name' "$chart")" >> "$GITHUB_OUTPUT"
          # Rancher catalog membership is declared by the chart, not the caller.
          # The annotation's value is the empty string, so test for presence.
          if yq -e '.annotations | has("openg2p.org/add-to-rancher")' "$chart" >/dev/null 2>&1; then
            echo "rancher=true" >> "$GITHUB_OUTPUT"
          else
            echo "rancher=false" >> "$GITHUB_OUTPUT"
          fi

      # ============ GitLab Helm registry path (chart-gitlab-project set) ============
      # Index-based Package Registry: Rancher adds ONE `helm repo add` URL and
      # browses every chart + version. Push is an HTTP upload (no `helm push`).
      - name: Publish chart to GitLab Helm registry
        if: inputs.chart-gitlab-project != ''
        env:
          HOST: ${{ inputs.chart-gitlab-host }}
          PROJECT: ${{ inputs.chart-gitlab-project }}
          CHANNEL: ${{ inputs.chart-gitlab-channel }}
          NAME: ${{ steps.pkg.outputs.name }}
          GL_USER: ${{ secrets.gitlab_registry_user }}
          GL_TOKEN: ${{ secrets.gitlab_registry_token }}
        run: |
          if [ -z "${GL_USER:-}" ] || [ -z "${GL_TOKEN:-}" ]; then
            echo "::error::chart-gitlab-project is set but gitlab_registry_user/token secrets are empty."
            exit 1
          fi
          # Address the project by URL-encoded path (group/project -> group%2Fproject)
          # so we never need to look up its numeric id.
          enc=$(printf '%s' "$PROJECT" | sed 's#/#%2F#g')
          base="${HOST}/api/v4/projects/${enc}/packages/helm"
          tgz=$(ls dist/*.tgz | head -1)

          # Idempotency: if already published, the pipeline was here before -- skip
          # (success) so a re-run that finishes a partial publish doesn't fail.
          # Drift is caught upstream by the image guard.
          if curl -fsSL --user "$GL_USER:$GL_TOKEN" "${base}/${CHANNEL}/index.yaml" 2>/dev/null \
               | yq -e ".entries[strenv(NAME)][] | select(.version == strenv(VERSION))" >/dev/null 2>&1; then
            if [ "${{ inputs.allow-overwrite }}" != "true" ]; then
              echo "${NAME} ${VERSION} already published; skipping (idempotent)."
              exit 0
            fi
            echo "::warning::overwriting ${NAME} ${VERSION} (allow-overwrite)"
          fi

          code=$(curl -sS -o /tmp/gl_resp -w '%{http_code}' --request POST \
            --user "$GL_USER:$GL_TOKEN" \
            --form "chart=@${tgz}" \
            "${base}/api/${CHANNEL}/charts")
          echo "HTTP ${code}"; cat /tmp/gl_resp 2>/dev/null || true; echo
          case "$code" in
            2*) : ;;
            *)  echo "::error::GitLab chart upload failed (HTTP ${code})"; exit 1 ;;
          esac
          echo "Published ${NAME} ${VERSION} to ${PROJECT} (channel ${CHANNEL})"
          echo "Consume: helm repo add openg2p ${base}/${CHANNEL} --username <user> --password <token>"

      # ============ OCI publish path (chart-oci-repo set) ============
      - name: Publish chart to OCI registry
        if: inputs.chart-oci-repo != '' && inputs.chart-gitlab-project == ''
        env:
          OCI_REPO: ${{ inputs.chart-oci-repo }}      # e.g. oci://ghcr.io/openg2p
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          host=$(printf '%s' "$OCI_REPO" | sed -E 's#^oci://##; s#/.*$##')
          echo "$host -> logging in with GITHUB_TOKEN"
          helm registry login "$host" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          # Idempotency: already published -> skip (success), so a re-run to finish
          # a partial publish doesn't fail. Drift is caught by the image guard.
          if helm pull "${OCI_REPO}/${NAME}" --version "$VERSION" -d /tmp/_exist >/dev/null 2>&1; then
            if [ "${{ inputs.allow-overwrite }}" != "true" ]; then
              echo "${NAME} ${VERSION} already published; skipping (idempotent)."
              exit 0
            fi
            echo "::warning::overwriting ${NAME} ${VERSION} (allow-overwrite)"
          fi
          helm push dist/*.tgz "$OCI_REPO"
          echo "Pushed ${OCI_REPO}/${NAME}:${VERSION}"

      # ============ HTTP/gh-pages publish path (default) ============
      - name: Checkout chart repo
        if: inputs.chart-oci-repo == '' && inputs.chart-gitlab-project == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.helm-repo }}
          ref: ${{ inputs.helm-repo-branch }}
          token: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
          path: chart-repo

      - name: Chart idempotency guard
        id: ghpages_guard
        if: inputs.chart-oci-repo == '' && inputs.chart-gitlab-project == ''
        env:
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          # Already in the index? Skip (idempotent) so a re-run finishing a partial
          # publish doesn't fail. Drift is caught upstream by the image guard.
          if yq -e '.entries[strenv(NAME)][] | select(.version == strenv(VERSION))' \
               chart-repo/index.yaml >/dev/null 2>&1; then
            if [ "${{ inputs.allow-overwrite }}" != "true" ]; then
              echo "$NAME $VERSION already published; skipping (idempotent)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::overwriting $NAME $VERSION (allow-overwrite)"
            fi
          fi

      - name: Publish
        if: inputs.chart-oci-repo == '' && inputs.chart-gitlab-project == '' && steps.ghpages_guard.outputs.skip != 'true'
        env:
          BRANCH: ${{ inputs.helm-repo-branch }}
          URL: ${{ inputs.helm-repo-url }}
          RANCHER: ${{ steps.pkg.outputs.rancher }}
        run: |
          cd chart-repo
          git config user.name "openg2p-bot"
          git config user.email "bot@openg2p.org"

          # Every repo in the org pushes to this one branch, so a concurrent
          # publish will reject ours. Rebuild on top of theirs and retry.
          attempt() {
            git fetch -q origin "$BRANCH"
            git reset -q --hard "origin/$BRANCH"

            cp ../dist/*.tgz .
            # Full regeneration, NOT `helm repo index --merge`. --merge appends
            # rather than replaces, which is how this index ended up with two
            # `0.0.0-develop` entries for the same chart pointing at different
            # digests. Regenerating is safe here because every .tgz is present.
            helm repo index . --url "$URL"

            if [ "$RANCHER" = "true" ]; then
              # The Rancher index must use --merge: its .tgz files are deleted
              # after indexing, so there is nothing to regenerate from. That is
              # only safe because versions are immutable -- --merge duplicates an
              # entry exactly when the same version is published twice, which the
              # overwrite guard above prevents.
              cp ../dist/*.tgz rancher/
              helm repo index --url ../ --merge rancher/index.yaml rancher
              rm -f rancher/*.tgz
            fi

            git add -A
            git diff --quiet --cached && { echo "nothing to publish"; return 0; }
            git commit -q -m "publish ${{ github.repository }} $VERSION"
            git push -q origin "HEAD:$BRANCH"
          }

          for i in 1 2 3 4 5; do
            if attempt; then exit 0; fi
            echo "::warning::push rejected (attempt $i), retrying"
            sleep $(( RANDOM % 10 + 5 ))
          done
          echo "::error::could not publish $VERSION to $BRANCH after 5 attempts"
          exit 1

  changelog:
    needs: [version, images, chart]
    # The catalogue must reflect only versions whose ARTIFACTS actually published, so a
    # FAILED images (build/promote) or chart job blocks the changelog -- otherwise a failed
    # publish would still yield a "published" version in the versions site. Skipped is fine
    # (a library skips images/chart; a chart-only repo skips images; no-chart repos skip
    # chart). A manual regenerate bypasses the gate (it only re-summarises an existing page).
    if: >-
      always() &&
      needs.version.result == 'success' &&
      ( inputs.changelog_regenerate != '' ||
        ( needs.images.result != 'failure' && needs.images.result != 'cancelled' &&
          needs.chart.result != 'failure' && needs.chart.result != 'cancelled' &&
          ( inputs.changelog_kind == 'library' ||
            needs.version.outputs.channel == 'develop' ||
            needs.version.outputs.channel == 'rc' ||
            needs.version.outputs.frozen == 'true' ) ) )
    runs-on: ubuntu-latest
    # One repo's changelog pushes are serialised against each other; the shared
    # branch is handled by the retry loop below (concurrency can't span repos).
    concurrency:
      group: changelog-${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Load changelog scripts
        uses: actions/checkout@v4
        with:
          repository: openg2p/openg2p-packaging
          ref: ${{ inputs.packaging-ref }}
          path: .openg2p-ci
          sparse-checkout: ci

      - name: Read summariser config
        id: cfg
        run: |
          f=.openg2p-ci/ci/changelog/config.yml
          echo "model=$(yq '.model' "$f")" >> "$GITHUB_OUTPUT"
          echo "fallbacks=$(yq '.fallbacks | join(",")' "$f")" >> "$GITHUB_OUTPUT"
          echo "max_tokens=$(yq '.max_tokens' "$f")" >> "$GITHUB_OUTPUT"
          echo "jira_base=$(yq '.jira_base // ""' "$f")" >> "$GITHUB_OUTPUT"
          echo "jira_project=$(yq '.jira_project // ""' "$f")" >> "$GITHUB_OUTPUT"

      # Links the catalogue shows for this version. Computed here rather than passed
      # between jobs: the chart job is conditional (a library or a no-chart repo skips
      # it), so depending on its outputs would drop the links exactly where the job
      # did not run.
      - name: Catalogue links
        id: links
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IMAGES_JSON: ${{ inputs.images }}
          CHART_PATHS: ${{ needs.version.outputs.chart_paths }}
          HELM_URL: ${{ inputs.helm-repo-url }}
          REGISTRY: ${{ inputs.registry }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          # Direct link to THIS version's packaged chart. Everything a version
          # actually contains -- pinned chart dependencies, image tags -- is inside
          # that package, so the page points at the artifact rather than trying to
          # duplicate (and drift from) its contents.
          # Every chart this version published, so the page can name them all.
          # They share one version -- the run derives a single one and stamps it
          # on each chart -- so listing them is not ambiguity, it is the fact.
          charts='[]'
          for cp in $(printf '%s' "${CHART_PATHS:-[]}" | jq -r '.[]'); do
            [ -f "${cp}/Chart.yaml" ] || continue
            name=$(yq '.name' "${cp}/Chart.yaml")
            charts=$(printf '%s' "$charts" | jq -c \
              --arg n "$name" --arg v "$VERSION" --arg u "${HELM_URL}/${name}-${VERSION}.tgz" \
              '. + [{name:$n, version:$v, url:$u}]')
          done
          echo "charts_json=${charts}" >> "$GITHUB_OUTPUT"
          # Where this repo's images live, for the page header. A repo with ONE image
          # links that image's page; with several, the namespace -- the header carries
          # a single link, and pointing at one of five would be arbitrary. A library
          # declares no images and gets no link at all.
          n=$(printf '%s' "${IMAGES_JSON:-[]}" | jq 'length')
          if [ "$REGISTRY" = "docker.io" ] && [ "$n" -ge 1 ]; then
            if [ "$n" -eq 1 ]; then
              repo=$(printf '%s' "$IMAGES_JSON" \
                | jq -r --arg ns "$NAMESPACE" '.[0].repo // ($ns + "/" + .[0].name)')
              echo "images_url=https://hub.docker.com/r/${repo}" >> "$GITHUB_OUTPUT"
            else
              echo "images_url=https://hub.docker.com/u/${NAMESPACE}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout changelog branch
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.changelog-repo }}
          ref: ${{ inputs.changelog-branch }}
          token: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
          path: changelog-pages

      - name: Build changelog
        id: run
        env:
          REPO: ${{ github.event.repository.name }}
          VERSION: ${{ needs.version.outputs.version }}
          FROZEN: ${{ needs.version.outputs.frozen }}
          REVISION: ${{ needs.version.outputs.revision }}
          PAGES_DIR: ${{ github.workspace }}/changelog-pages
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          IMAGES_URL: ${{ steps.links.outputs.images_url }}
          CHARTS_JSON: ${{ steps.links.outputs.charts_json }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # kind + the moving branch drive library mode (rolling per-branch page keyed
          # by SHA, grouped under "Libraries" in the catalogue).
          CHANGELOG_KIND: ${{ inputs.changelog_kind }}
          BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
          ARTIFACT_SOURCE: ${{ inputs.artifact-source }}
          SKIP_AI: ${{ inputs.changelog_skip_ai }}
          REGEN_VERSION: ${{ inputs.changelog_regenerate }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ steps.cfg.outputs.model }}
          OPENROUTER_FALLBACKS: ${{ steps.cfg.outputs.fallbacks }}
          MAX_TOKENS: ${{ steps.cfg.outputs.max_tokens }}
          JIRA_BASE: ${{ steps.cfg.outputs.jira_base }}
          JIRA_PROJECT: ${{ steps.cfg.outputs.jira_project }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          GH_API_TOKEN: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ] && [ "${SKIP_AI}" != "true" ]; then
            echo "::warning::OPENROUTER_API_KEY not set; publishing human notes only"
            export SKIP_AI=true
          fi

          # Release notes (releases only): prefer the editable GitHub Release BODY over
          # the tag message, so notes can be refined AFTER cutting -- edit the Release,
          # then re-run this workflow on the tag. Every build/promote/chart job is
          # idempotent, so only the changelog page changes; the tag is never moved.
          # Best-effort: on any failure run.sh falls back to the annotated tag message.
          if [ "${FROZEN}" = "true" ] && [ -n "${RELEASE_TAG:-}" ]; then
            body=$(curl -fsSL -H "Authorization: Bearer ${GH_API_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null \
              | jq -r '.body // ""' 2>/dev/null || true)
            if [ -n "$body" ] && [ "$body" != "null" ]; then
              printf '%s\n' "$body" > "${GITHUB_WORKSPACE}/release-notes.md"
              export RELEASE_NOTES_FILE="${GITHUB_WORKSPACE}/release-notes.md"
              echo "release notes: using GitHub Release body for ${RELEASE_TAG}"
            else
              echo "release notes: no GitHub Release body; using annotated tag if present"
            fi
          fi

          DATE="$(date -u +%Y-%m-%d)" bash .openg2p-ci/ci/changelog/run.sh

      - name: Publish to changelog branch
        if: steps.run.outputs.published == 'true'
        env:
          BRANCH: ${{ inputs.changelog-branch }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.event.repository.name }}
        working-directory: changelog-pages
        run: |
          git config user.name "openg2p-bot"
          git config user.email "bot@openg2p.org"
          # Regenerate our files onto the latest branch tip each attempt: many
          # repos push here, and per-repo folders keep conflicts rare.
          attempt() {
            # A fetch failure (no access to the changelog repo, network) must end the
            # attempt here. Falling through would reset onto a stale local ref and
            # produce a confusing result far from the real cause.
            git fetch -q origin "$BRANCH" || return 1
            git stash -q --include-untracked || true
            git reset -q --hard "origin/$BRANCH"
            git stash pop -q 2>/dev/null || true
            git add -A
            if git diff --quiet --cached; then
              # Nothing staged. On the FIRST attempt that legitimately means this
              # version's page is already published -- a re-run of the same commit.
              #
              # On a RETRY it means something else: the previous attempt committed and
              # then failed to push, and the reset above has just discarded that
              # commit. Returning success here would end the loop green having
              # published nothing, which is exactly how a 403 on the changelog repo
              # turned into a passing job that wrote no catalogue entry.
              [ "$i" -eq 1 ] && { echo "no changelog change"; return 0; }
              echo "::error::changelog changes were lost between attempts -- see the first failure above"
              return 1
            fi
            git commit -q -m "changelog: ${REPO} ${VERSION}"
            git push -q origin "HEAD:$BRANCH"
          }
          for i in 1 2 3 4 5; do
            if attempt; then exit 0; fi
            echo "::warning::changelog push rejected (attempt $i), retrying"
            sleep $(( RANDOM % 10 + 5 ))
          done
          echo "::error::could not publish changelog after 5 attempts"
          exit 1
